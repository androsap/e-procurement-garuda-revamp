<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garuda Indonesia e-Procurement</title>
<meta name="description" content="Portal Resmi Pengadaan Garuda Indonesia — telusuri tender aktif, pantau tenggat waktu, dan ajukan penawaran.">
<meta name="theme-color" content="#0A2A55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  :root {
    --navy: #0A2A55;
    --navy-deep: #081C3B;
    --ink: #152A4D;
    --text: #33415C;
    --muted: #556685;
    --faint: #8494B3;
    --line: #C3CEDE;
    --line-soft: #DCE4F0;
    --bg: #EEF2F8;
    --panel: #ECEEF2;
    --link: #1D4E8F;
    --teal: #00707C;
    --gold: #F4B400;
    --danger: #B3261E;
    /* full-bleed band, content centred within 1280px */
    --pad-inline: max(40px, calc((100% - 1280px) / 2));
  }
  body {
    background: var(--bg);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  img { max-width: 100%; display: block; }
  a { color: var(--link); }
  a:hover { color: #12335E; }
  button { font-family: inherit; }

  .shell {
    width: 100%;
    min-height: 100vh;
    background: #fff;
    overflow: hidden;
  }

  /* ---------- top utility bar ---------- */
  .topbar {
    background: var(--navy);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 16px;
    padding: 14px var(--pad-inline);
    font-size: 12px;
    font-weight: 600;
  }
  .topbar__time { letter-spacing: 0.02em; }

  .langpick { position: relative; }
  .langpick__btn {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    color: #fff;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.02em;
  }
  .langpick__btn img { width: 16px; height: 16px; object-fit: cover; border-radius: 99px; }
  .langpick__caret { font-size: 11px; }
  .langpick__menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: 260px;
    background: #fff;
    color: var(--ink);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(10, 42, 85, 0.25);
    padding: 18px;
    z-index: 60;
  }
  .langpick__menu[hidden] { display: none; }
  .langpick__title { font-size: 13px; font-weight: 700; margin-bottom: 14px; }
  .langpick__opt {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #F6F8FC;
    cursor: pointer;
    font-size: 14px; font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .langpick__opt:last-child { margin-bottom: 0; }
  .langpick__opt:hover { background: #EDF2FA; }
  .langpick__opt img { width: 18px; height: 18px; object-fit: cover; border-radius: 99px; }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 24px var(--pad-inline);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .masthead__logo img { height: 40px; width: auto; object-fit: contain; }
  .masthead__burger {
    display: none;
    margin-left: auto;
    width: 44px; height: 44px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .masthead__burger span {
    display: block;
    width: 20px; height: 2px;
    background: var(--navy);
    transition: transform 0.25s ease, opacity 0.2s ease;
  }
  .masthead__burger.is-x span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .masthead__burger.is-x span:nth-child(2) { opacity: 0; }
  .masthead__burger.is-x span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .masthead__nav {
    display: flex;
    align-items: center;
    gap: 32px;
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .masthead__nav a { color: var(--text); text-decoration: none; }
  .masthead__nav a:hover { color: var(--navy); }
  .masthead__auth { margin-left: auto; display: flex; gap: 12px; }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    text-align: center;
  }
  .btn--ghost { border: 1.5px solid var(--navy); background: #fff; color: var(--navy); }
  .btn--solid { border: none; background: var(--navy); color: #fff; }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    margin: 40px var(--pad-inline) 0;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 21 / 9;
    background: var(--navy);
  }
  .hero__slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .hero__slide.is-active { opacity: 1; }
  .hero__slide img { width: 100%; height: 100%; object-fit: cover; object-position: left center; }
  .hero__nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(10, 42, 85, 0.55);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .hero__nav:hover { background: rgba(10, 42, 85, 0.8); }
  .hero__nav--prev { left: 20px; }
  .hero__nav--next { right: 20px; }
  .hero__dots {
    position: absolute;
    bottom: 20px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 8px;
    z-index: 2;
  }
  .hero__dots button {
    width: 8px; height: 8px;
    border-radius: 4px;
    border: none;
    padding: 0;
    background: rgba(255, 255, 255, 0.55);
    cursor: pointer;
    transition: width 0.3s ease, background 0.3s ease;
  }
  .hero__dots button.is-active { width: 22px; background: var(--gold); }

  /* ---------- search ---------- */
  .search {
    position: relative;
    z-index: 3;
    margin: -48px calc(var(--pad-inline) + 44px) 0;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    display: flex;
    gap: 12px;
    box-shadow: 0 20px 50px rgba(10, 42, 85, 0.18);
  }
  .search__input, .search__select {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
  }
  .search__input { flex: 2; min-width: 0; }
  .search__select { flex: 1; min-width: 0; }
  .search__btn {
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 14px 28px;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
  }
  .search__btn:hover { background: #005b65; }

  /* ---------- generic block ---------- */
  .block { padding: 48px var(--pad-inline); }
  .block--alt { background: var(--panel); padding-top: 56px; }
  .block__title {
    font-size: 24px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 40px;
  }
  .block__title--news { color: var(--navy); margin-bottom: 24px; }

  /* ---------- tabs + chips ---------- */
  .tabs {
    display: flex;
    gap: 24px;
    align-items: center;
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .tabs__tab {
    border: none;
    background: transparent;
    font-size: 22px;
    font-weight: 800;
    padding: 0 0 10px;
    color: var(--faint);
    border-bottom: 3px solid transparent;
    cursor: pointer;
    white-space: nowrap;
  }
  .tabs__tab.is-active { color: var(--navy); border-color: var(--navy); }

  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  .chips button {
    padding: 8px 18px;
    border-radius: 999px;
    border: none;
    font-size: 13px;
    font-weight: 700;
    background: #F1F4F9;
    color: var(--text);
    cursor: pointer;
  }
  .chips button.is-active { background: var(--navy); color: #fff; }

  /* ---------- tender cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #fff;
    transition: box-shadow 0.2s ease;
  }
  .card:hover { box-shadow: 0 10px 30px rgba(10, 42, 85, 0.12); }
  .card__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card__cat {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .card__status {
    font-size: 11px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .card__title {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card__meta { font-size: 13px; color: var(--muted); }
  .card__meta b { color: var(--danger); }
  .card__value { font-size: 13px; color: var(--text); font-weight: 600; }
  .card__link { font-size: 13px; font-weight: 700; margin-top: 4px; text-decoration: none; }
  .card--all {
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 16px;
    font-weight: 800;
    color: var(--navy);
    background: var(--panel);
    text-decoration: none;
    min-height: 166px;
  }

  /* ---------- steps ---------- */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .step__img {
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 24px;
    background: #F6F8FC;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step__img img { width: 100%; height: 220px; object-fit: contain; }
  .step__text { font-size: 16px; color: var(--ink); line-height: 1.6; }
  .step__text b { font-weight: 800; }

  /* ---------- news ---------- */
  .news { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .newscard {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  .newscard__img { height: 140px; background: var(--navy); flex-shrink: 0; }
  .newscard__img img { width: 100%; height: 100%; object-fit: cover; }
  .newscard__body { padding: 18px; }
  .newscard__date { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .newscard__title {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .newscard__link { font-size: 13px; font-weight: 700; text-decoration: none; }

  /* ---------- footer ---------- */
  .foot {
    background: var(--navy-deep);
    color: #9FB0CC;
    padding: 28px var(--pad-inline);
    font-size: 13px;
  }
  .foot__row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }
  .foot a { color: #9FB0CC; }
  .foot__site { font-weight: 700; text-decoration: underline; }
  .foot__powered { display: flex; align-items: center; gap: 8px; color: #7C8DAB; }
  .foot__powered img { height: 20px; width: auto; object-fit: contain; }

  /* ================= TABLET ================= */
  @media (max-width: 1024px) {
    :root { --pad-inline: max(24px, calc((100% - 1280px) / 2)); }
    .topbar { padding: 12px var(--pad-inline); }
    .masthead { gap: 16px; padding: 18px var(--pad-inline); }
    .masthead__burger { display: flex; }
    .masthead__nav {
      order: 3;
      flex: 0 0 100%;
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      margin-top: 12px;
    }
    .masthead__nav.is-open { display: flex; }
    .masthead__nav a { padding: 14px 4px; border-top: 1px solid var(--line-soft); }
    .masthead__auth {
      margin-left: 0;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line-soft);
    }
    .masthead__auth .btn { flex: 1; text-align: center; }

    .hero { margin: 24px var(--pad-inline) 0; aspect-ratio: 16 / 9; }
    .search { margin: -40px var(--pad-inline) 0; flex-wrap: wrap; }
    .search__input { flex: 1 1 100%; }
    .search__select { flex: 1 1 calc(50% - 6px); }
    .search__btn { flex: 1 1 100%; }

    .block { padding: 40px var(--pad-inline); }
    .block--alt { padding-top: 44px; }
    .block__title { margin-bottom: 28px; }

    .cards, .steps, .news { grid-template-columns: repeat(2, 1fr); gap: 20px; }
  }

  /* ================= MOBILE ================= */
  @media (max-width: 640px) {
    :root { --pad-inline: max(16px, calc((100% - 1280px) / 2)); }
    .topbar {
      padding: 10px var(--pad-inline);
      gap: 10px;
      font-size: 11px;
      justify-content: space-between;
    }
    .masthead { padding: 16px var(--pad-inline); }
    .masthead__logo img { height: 32px; }

    .hero { margin: 16px var(--pad-inline) 0; aspect-ratio: 16 / 9; border-radius: 12px; }
    .hero__nav { width: 36px; height: 36px; font-size: 16px; }
    .hero__nav--prev { left: 10px; }
    .hero__nav--next { right: 10px; }
    .hero__dots { bottom: 12px; }

    .search {
      margin: -24px var(--pad-inline) 0;
      flex-direction: column;
      padding: 16px;
      gap: 10px;
      border-radius: 12px;
    }
    .search__select { flex: 1 1 100%; }

    .block { padding: 32px var(--pad-inline); }
    .block--alt { padding-top: 36px; }
    .block__title { font-size: 20px; margin-bottom: 20px; }

    .tabs { gap: 18px; }
    .tabs__tab { font-size: 17px; }

    .cards, .steps, .news { grid-template-columns: 1fr; gap: 18px; }
    .card { padding: 20px; }
    .step__img img { height: 190px; }

    .foot { padding: 24px var(--pad-inline); }
    .foot__row { flex-direction: column; text-align: center; gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero__slide, .hero__dots button, .masthead__burger span { transition: none; }
  }
</style>
</head>
<body>
<div class="shell">

  <!-- ===== top utility bar ===== -->
  <div class="topbar">
    <span class="topbar__time" id="liveDateTime"></span>
    <div class="langpick">
      <button class="langpick__btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <img id="langFlag" src="img/flag-id.png" alt="">
        <span id="langCode">ID</span>
        <span class="langpick__caret" aria-hidden="true">&#9662;</span>
      </button>
      <div class="langpick__menu" id="langMenu" hidden>
        <div class="langpick__title">Pilih bahasa</div>
        <button class="langpick__opt" type="button" data-lang="en">
          <img src="img/flag-en.png" alt=""><span>English</span>
        </button>
        <button class="langpick__opt" type="button" data-lang="id">
          <img src="img/flag-id.png" alt=""><span>Bahasa Indonesia</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== masthead ===== -->
  <header class="masthead">
    <a class="masthead__logo" href="#" aria-label="Garuda Indonesia e-Procurement">
      <img src="img/garuda-skyteam.png" alt="Garuda Indonesia">
    </a>
    <button class="masthead__burger" id="burger" type="button" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="masthead__nav" id="nav">
      <a href="#">Home</a>
      <a href="#">Announcement</a>
      <a href="#">FAQ</a>
      <a href="#">Policy</a>
      <a href="#">Contact Us</a>
      <div class="masthead__auth">
        <button class="btn btn--ghost" type="button" data-i18n="cta_login"></button>
        <a class="btn btn--solid" href="daftar.html" data-i18n="cta_register"></a>
      </div>
    </nav>
  </header>

  <main>
    <!-- ===== hero ===== -->
    <section class="hero" aria-label="Highlight">
      <div class="hero__slide is-active"><img src="img/hero1.webp" alt="Sistem pengadaan elektronik Garuda Indonesia"></div>
      <div class="hero__slide"><img src="img/hero2.webp" alt="Tolak dan laporkan gratifikasi"></div>
      <button class="hero__nav hero__nav--prev" id="heroPrev" type="button" aria-label="Sebelumnya">&#8249;</button>
      <button class="hero__nav hero__nav--next" id="heroNext" type="button" aria-label="Berikutnya">&#8250;</button>
      <div class="hero__dots" id="heroDots"></div>
    </section>

    <!-- ===== search ===== -->
    <form class="search" id="searchForm">
      <input class="search__input" id="searchInput" type="text" autocomplete="off">
      <select class="search__select" id="selCategory" aria-label="Kategori"></select>
      <select class="search__select" id="selStatus" aria-label="Status"></select>
      <button class="search__btn" id="searchBtn" type="submit"></button>
    </form>

    <!-- ===== tenders ===== -->
    <section class="block">
      <div class="tabs" role="tablist">
        <button class="tabs__tab is-active" type="button" data-tab="sourcing" data-i18n="tab_sourcing"></button>
        <button class="tabs__tab" type="button" data-tab="bidding" data-i18n="tab_bidding"></button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="cards" id="tenderCards"></div>
    </section>

    <!-- ===== steps ===== -->
    <section class="block block--alt">
      <h2 class="block__title" data-i18n="section_steps"></h2>
      <div class="steps" id="steps"></div>
    </section>

    <!-- ===== news ===== -->
    <section class="block">
      <h2 class="block__title block__title--news" data-i18n="section_news"></h2>
      <div class="news" id="news"></div>
    </section>
  </main>

  <!-- ===== footer ===== -->
  <footer class="foot">
    <div class="foot__row">
      <span class="foot__site"><a href="https://garuda-indonesia.com">garuda-indonesia.com</a></span>
      <span>copyrights &copy; 2026. <span data-i18n="footer_rights"></span></span>
      <span class="foot__powered">Powered by <img src="img/amala-white.png" alt="Asyst"></span>
    </div>
  </footer>
</div>

var STATUS_STYLE = {
  open:    { bg: "#E6F4EA", color: "#1E7B34" },
  prequal: { bg: "#FEF3D6", color: "#946200" },
  closed:  { bg: "#EDEFF3", color: "#5A6478" }
};

var FLAGS = { id: "img/flag-id.png", en: "img/flag-en.png" };
var HERO_IMAGES = ["img/hero1.webp", "img/hero2.webp"];
var STEP_IMAGES = ["img/step1.webp", "img/step2.webp", "img/step3.webp"];
var NEWS_IMAGES = ["img/news1.webp", "img/news2.webp", "img/news3.webp"];
var CHIP_KEYS = ["all", "open", "prequal", "closed"];

var state = { lang: "id", tab: "sourcing", chip: "all", hero: 0, langMenu: false, menu: false };
var autoTimer = null;

function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function elem(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function T() { return TEXTS[state.lang]; }

/* ---------- static / attribute i18n ---------- */
function applyI18n() {
  var d = T();
  $all("[data-i18n]").forEach(function (n) {
    var k = n.getAttribute("data-i18n");
    if (d[k] != null) n.textContent = d[k];
  });
  $("#searchInput").setAttribute("placeholder", d.search_placeholder);
  $("#searchBtn").textContent = d.search_btn;
  $("#selCategory").innerHTML = "<option>" + esc(d.filter_category) + "</option>";
  $("#selStatus").innerHTML = "<option>" + esc(d.filter_status) + "</option>";
  document.documentElement.lang = state.lang;
  $("#langCode").textContent = state.lang.toUpperCase();
  $("#langFlag").src = FLAGS[state.lang];
}

/* ---------- live clock ---------- */
function tickClock() {
  var loc = state.lang === "id" ? "id-ID" : "en-GB";
  $("#liveDateTime").textContent = new Date().toLocaleString(loc, {
    weekday: "long", day: "2-digit", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });
}

/* ---------- hero carousel ---------- */
function buildHeroDots() {
  var wrap = $("#heroDots");
  wrap.innerHTML = "";
  HERO_IMAGES.forEach(function (_, i) {
    var b = elem("button", i === state.hero ? "is-active" : "");
    b.type = "button";
    b.setAttribute("aria-label", "Slide " + (i + 1));
    b.addEventListener("click", function () { state.hero = i; syncHero(); restartAuto(); });
    wrap.appendChild(b);
  });
}
function syncHero() {
  $all(".hero__slide").forEach(function (s, i) { s.classList.toggle("is-active", i === state.hero); });
  $all("#heroDots button").forEach(function (b, i) { b.classList.toggle("is-active", i === state.hero); });
}
function heroStep(delta) {
  state.hero = (state.hero + delta + HERO_IMAGES.length) % HERO_IMAGES.length;
  syncHero();
}
function startAuto() { autoTimer = setInterval(function () { heroStep(1); }, 5000); }
function restartAuto() { clearInterval(autoTimer); startAuto(); }

/* ---------- filter chips ---------- */
function renderChips() {
  var d = T();
  var wrap = $("#chips");
  wrap.innerHTML = "";
  CHIP_KEYS.forEach(function (k) {
    var b = elem("button", k === state.chip ? "is-active" : "", esc(d["chip_" + k]));
    b.type = "button";
    b.addEventListener("click", function () { state.chip = k; renderChips(); renderTenders(); });
    wrap.appendChild(b);
  });
}

/* ---------- tender cards ---------- */
function renderTenders() {
  var d = T();
  var wrap = $("#tenderCards");
  wrap.innerHTML = "";
  var list = d.tenders.filter(function (tn) {
    return state.chip === "all" || tn.status === state.chip;
  }).slice(0, 5);

  list.forEach(function (tn) {
    var s = STATUS_STYLE[tn.status] || STATUS_STYLE.closed;
    var card = elem("article", "card");
    card.innerHTML =
      '<div class="card__top">' +
        '<span class="card__cat">' + esc(tn.category) + "</span>" +
        '<span class="card__status" style="background:' + s.bg + ";color:" + s.color + '">' + esc(d["status_" + tn.status]) + "</span>" +
      "</div>" +
      '<div class="card__title">' + esc(tn.title) + "</div>" +
      '<div class="card__meta">' + esc(d.deadline) + ": <b>" + esc(tn.deadline) + "</b></div>" +
      '<div class="card__value">' + esc(tn.value) + "</div>" +
      '<a class="card__link" href="#">' + esc(d.view_detail) + " &rarr;</a>";
    wrap.appendChild(card);
  });

  if (!list.length) {
    wrap.appendChild(elem("div", "card", '<div class="card__meta">' + esc(d.fallback_note) + "</div>"));
  }

  var all = elem("a", "card card--all");
  all.href = "#";
  all.textContent = d.view_all + " →";
  wrap.appendChild(all);
}

/* ---------- steps ---------- */
function renderSteps() {
  var d = T();
  var wrap = $("#steps");
  wrap.innerHTML = "";
  d.steps.forEach(function (st, i) {
    var label = (state.lang === "id" ? "Langkah " : "Step ") + (i + 1) + ".";
    var box = elem("div", "step");
    box.innerHTML =
      '<div class="step__img"><img src="' + STEP_IMAGES[i] + '" alt="' + esc(st.title) + '" loading="lazy"></div>' +
      '<p class="step__text"><b>' + esc(label) + "</b> " + esc(st.desc) + "</p>";
    wrap.appendChild(box);
  });
}

/* ---------- news ---------- */
function renderNews() {
  var d = T();
  var wrap = $("#news");
  wrap.innerHTML = "";
  d.news.forEach(function (n, i) {
    var card = elem("article", "newscard");
    card.innerHTML =
      '<div class="newscard__img"><img src="' + NEWS_IMAGES[i] + '" alt="" loading="lazy"></div>' +
      '<div class="newscard__body">' +
        '<div class="newscard__date">' + esc(n.date) + "</div>" +
        '<div class="newscard__title">' + esc(n.title) + "</div>" +
        '<a class="newscard__link" href="#">' + esc(d.read_more) + " &rarr;</a>" +
      "</div>";
    wrap.appendChild(card);
  });
}

/* ---------- tabs (visual state, matches source design) ---------- */
function renderTabs() {
  $all(".tabs__tab").forEach(function (b) {
    b.classList.toggle("is-active", b.getAttribute("data-tab") === state.tab);
  });
}

/* ---------- language ---------- */
function closeLangMenu() {
  state.langMenu = false;
  $("#langMenu").hidden = true;
  $("#langBtn").setAttribute("aria-expanded", "false");
}
function setLang(lang) {
  if (lang !== "id" && lang !== "en") return;
  state.lang = lang;
  closeLangMenu();
  renderAll();
}

function renderAll() {
  applyI18n();
  tickClock();
  renderChips();
  renderTenders();
  renderSteps();
  renderNews();
  renderTabs();
  buildHeroDots();
  syncHero();
}

/* ---------- init ---------- */
function init() {
  // language dropdown
  $("#langBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    state.langMenu = !state.langMenu;
    $("#langMenu").hidden = !state.langMenu;
    this.setAttribute("aria-expanded", String(state.langMenu));
  });
  $("#langMenu").addEventListener("click", function (e) { e.stopPropagation(); });
  $all(".langpick__opt").forEach(function (b) {
    b.addEventListener("click", function () { setLang(this.getAttribute("data-lang")); });
  });
  document.addEventListener("click", function () { if (state.langMenu) closeLangMenu(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeLangMenu(); closeMenu(); }
  });

  // mobile nav
  $("#burger").addEventListener("click", function () {
    state.menu = !state.menu;
    $("#nav").classList.toggle("is-open", state.menu);
    this.classList.toggle("is-x", state.menu);
    this.setAttribute("aria-expanded", String(state.menu));
  });
  $all("#nav a").forEach(function (a) { a.addEventListener("click", closeMenu); });

  // hero controls
  $("#heroPrev").addEventListener("click", function () { heroStep(-1); restartAuto(); });
  $("#heroNext").addEventListener("click", function () { heroStep(1); restartAuto(); });

  // tabs
  $all(".tabs__tab").forEach(function (b) {
    b.addEventListener("click", function () { state.tab = this.getAttribute("data-tab"); renderTabs(); });
  });

  // search (demo only)
  $("#searchForm").addEventListener("submit", function (e) { e.preventDefault(); });

  renderAll();
  setInterval(tickClock, 1000);
  startAuto();
}
function closeMenu() {
  state.menu = false;
  $("#nav").classList.remove("is-open");
  $("#burger").classList.remove("is-x");
  $("#burger").setAttribute("aria-expanded", "false");
}

if (document.readyState !== "loading") init();
else document.addEventListener("DOMContentLoaded", init);
</script>
